name: Same-allocation Windows ARM build-only runtime control

on:
  workflow_call:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"

jobs:
  screen:
    if: github.repository == 'yeelam-gordon/fastapi' && github.run_attempt == '1'
    runs-on: windows-11-arm
    timeout-minutes: 4
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /Generated Files/.gitattributes
            /Generated Files/arm-build/.gitattributes
            /Generated Files/arm-build/hobl-complete-ci/
            /Generated Files/arm-build/hobl-parallel-screen/
            /Generated Files/arm-build/hobl-build-runtime-screen/
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fastapi/fastapi
          ref: 864b569cf8453654fc3bc2c64108c0f644e2918c
          path: package-source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        id: stock
        with:
          python-version: "3.13.15"
          architecture: arm64
          update-environment: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.13.6"
          enable-cache: "false"
      - name: Owned exact managed runtime
        id: managed
        env:
          UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}\managed-python
          UV_CACHE_DIR: ${{ github.workspace }}\managed-python-cache
          UV_HTTP_RETRIES: "0"
          UV_HTTP_TIMEOUT: "20"
        run: |
          $ErrorActionPreference = 'Stop'
          & uv python install 3.13.15 --install-dir $env:UV_PYTHON_INSTALL_DIR --no-bin --no-registry --no-config --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $python = & uv python find 3.13.15 --managed-python --no-python-downloads --no-project --no-config --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $root = [IO.Path]::GetFullPath($env:UV_PYTHON_INSTALL_DIR) + [IO.Path]::DirectorySeparatorChar
          if (-not ([IO.Path]::GetFullPath($python)).StartsWith($root, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Managed interpreter escaped owned install: $python"
          }
          "python-path=$python" >> $env:GITHUB_OUTPUT
      - name: Tiny shared backend preparation and owned six-build cohort
        env:
          STOCK_PYTHON: ${{ steps.stock.outputs.python-path }}
          MANAGED_PYTHON: ${{ steps.managed.outputs.python-path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:GITHUB_WORKSPACE 'build-runtime-evidence'
          New-Item -ItemType Directory -Path $out -ErrorAction Stop | Out-Null
          $helper = Join-Path $env:GITHUB_WORKSPACE 'tools\Generated Files\arm-build\hobl-build-runtime-screen\screen.py'
          $args = @('--source', (Join-Path $env:GITHUB_WORKSPACE 'package-source'), '--output', $out, '--uv', (Get-Command uv).Source, '--stock', $env:STOCK_PYTHON, '--managed', $env:MANAGED_PYTHON)
          & $env:STOCK_PYTHON -I -B $helper prepare @args
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $env:STOCK_PYTHON -I -B $helper run @args
          exit $LASTEXITCODE
      - name: Retain raw outputs including first failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hobl-build-runtime-screen-windows-arm
          path: build-runtime-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
