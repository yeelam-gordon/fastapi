name: Exclusive hosted ARM build ETW (research only)

on:
  workflow_call:

permissions:
  contents: read
  actions: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"

jobs:
  trace:
    if: github.repository == 'yeelam-gordon/fastapi' && github.run_attempt == '1'
    runs-on: windows-11-arm
    timeout-minutes: 8
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /Generated Files/.gitattributes
            /Generated Files/arm-build/.gitattributes
            /Generated Files/arm-build/hobl-complete-ci/
            /Generated Files/arm-build/hobl-parallel-screen/
            /Generated Files/arm-build/hobl-build-etw/
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fastapi/fastapi
          ref: 864b569cf8453654fc3bc2c64108c0f644e2918c
          path: package-source
          persist-credentials: false
      - name: Create private raw storage before native output
        run: |
          . '.\tools\Generated Files\arm-build\hobl-build-etw\private.ps1'
          New-PrivateDirectory (Join-Path $env:GITHUB_WORKSPACE 'etl-private')
      - name: Actual hosted run, elevated token, tools and idle recorder gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & '.\tools\Generated Files\arm-build\hobl-build-etw\preflight.ps1' -Private (Join-Path $env:GITHUB_WORKSPACE 'etl-private') -Public (Join-Path $env:GITHUB_WORKSPACE 'etl-public')
          exit $LASTEXITCODE
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.13.6"
          enable-cache: "false"
      - name: Managed normal-GIL Python and bounded research controller
        env:
          GH_TOKEN: ${{ github.token }}
          UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}\etl-private\managed-python
          UV_CACHE_DIR: ${{ github.workspace }}\etl-private\managed-cache
          UV_HTTP_RETRIES: "0"
          UV_HTTP_TIMEOUT: "20"
        run: |
          $ErrorActionPreference = 'Stop'
          $private = Join-Path $env:GITHUB_WORKSPACE 'etl-private'
          $public = Join-Path $env:GITHUB_WORKSPACE 'etl-public'
          function Stop-Setup([string] $Tool, [int] $Code) {
            @{schema=1;stage='prepare';tool=$Tool;native_code=$Code;status='FAILED';reason='native_command';residual_buffers_possible=$false} |
              ConvertTo-Json | Set-Content (Join-Path $public 'stage.json')
            exit 1
          }
          try {
          '{"schema":1,"stage":"prepare","tool":"uv","native_code":0,"status":"RUNNING","reason":"none","residual_buffers_possible":false}' |
            Set-Content -LiteralPath (Join-Path $public 'stage.json')
          & uv python install 3.13.15 --install-dir $env:UV_PYTHON_INSTALL_DIR --no-bin --no-registry --no-config --no-progress *> (Join-Path $private 'managed-install.log')
          if ($LASTEXITCODE) { Stop-Setup 'uv' $LASTEXITCODE }
          $python = & uv python find 3.13.15 --managed-python --no-python-downloads --no-project --no-config --no-progress 2> (Join-Path $private 'managed-find.log')
          if ($LASTEXITCODE) { Stop-Setup 'uv' $LASTEXITCODE }
          $prefix = [IO.Path]::GetFullPath($env:UV_PYTHON_INSTALL_DIR) + '\'
          if (-not ([IO.Path]::GetFullPath($python)).StartsWith($prefix, [StringComparison]::OrdinalIgnoreCase)) { Stop-Setup 'controller' -1 }
          & $python -I -B -c "import sys,sysconfig; assert sys.version_info[:3]==(3,13,15); assert sysconfig.get_platform()=='win-arm64'; assert sys._is_gil_enabled(); assert not hasattr(sys,'gettotalrefcount')" *> (Join-Path $private 'python-check.log')
          if ($LASTEXITCODE) { Stop-Setup 'python' $LASTEXITCODE }
          & $python -B '.\tools\Generated Files\arm-build\hobl-build-etw\capture.py' --private $private --public $public --source (Join-Path $env:GITHUB_WORKSPACE 'package-source') --uv (Get-Command uv).Source *> (Join-Path $private 'controller.log')
          exit $LASTEXITCODE
          } catch {
            $_ | Out-File -LiteralPath (Join-Path $private 'setup-error.log')
            Stop-Setup 'controller' $_.Exception.HResult
          }
      - name: Upload allowlisted owned-family summaries only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hobl-build-etw-sanitized
          path: |
            etl-public/stage.json
            etl-public/calibration.json
            etl-public/build.json
            etl-public/capture-proof.json
            etl-public/calibration-schema.json
            etl-public/build-schema.json
            etl-public/calibration-reader.json
            etl-public/build-reader.json
            etl-public/calibration-modules.json
            etl-public/build-modules.json
          if-no-files-found: error
          retention-days: 7
