name: Windows ARM worktree preparation screen (fork only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    if: github.repository == 'yeelam-gordon/fastapi' && github.event_name == 'workflow_dispatch' && github.run_attempt == '1'
    runs-on: windows-11-arm
    timeout-minutes: 6
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
        with:
          ref: ${{ github.sha }}
          path: tools
          persist-credentials: false
          set-safe-directory: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /Generated Files/.gitattributes
            /Generated Files/arm-build/.gitattributes
            /Generated Files/arm-build/hosted-worktree-preparation-20261124/launch.ps1
            /Generated Files/arm-build/hosted-worktree-preparation-20261124/screen.py
            /Generated Files/arm-build/hobl-complete-ci/owned_process.py
            /Generated Files/arm-build/hobl-build-etw/private.ps1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
        with:
          repository: fastapi/fastapi
          ref: 864b569cf8453654fc3bc2c64108c0f644e2918c
          path: package-source
          persist-credentials: false
          set-safe-directory: false
          fetch-depth: 1
          filter: ""
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.13.6"
          enable-cache: "false"
      - name: Private managed runtime and exactly four owned worktree adds
        run: |
          & '.\tools\Generated Files\arm-build\hosted-worktree-preparation-20261124\launch.ps1'
          exit $LASTEXITCODE
      - name: Upload exact sanitized result and failure stage only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-arm-worktree-preparation
          path: |
            worktree-public/result.json
            worktree-public/stage.json
          if-no-files-found: warn
          retention-days: 7
