name: ARM build diagnostics (analysis only)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"
  MATCHED_PROFILE: stock-hobl-storage-ci82-v1
  MATCHED_JOB_SECONDS: "600"
  HOBL_COLLECTION_BOUNDARY_DIAGNOSTIC: "1"
  PYTHONNOUSERSITE: "1"

jobs:
  stock-reference:
    if: github.repository == 'yeelam-gordon/fastapi' && github.run_attempt == 1
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-11-arm
            platform: windows
            workers: 4
          - runner: macos-15
            platform: macos
            workers: 3
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Record job clock and existing storage
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted' -or
              [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString() -cne 'Arm64') {
            throw 'Expected a standard hosted ARM64 runner'
          }
          "MATCHED_STARTED=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV
          if ($env:RUNNER_OS -eq 'Windows') {
            foreach ($path in @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:RUNNER_TOOL_CACHE, $env:TEMP)) {
              if ([IO.Path]::GetPathRoot($path) -ine 'C:\') { throw 'Expected Windows inputs on C:' }
            }
            $volume = Get-Volume -DriveLetter C
            if ($volume.FileSystem -cne 'NTFS' -or $volume.HealthStatus -ne 'Healthy') {
              throw 'Expected healthy C: NTFS'
            }
            Write-Output "Windows C: NTFS; image $env:ImageOS $env:ImageVersion"
          } else {
            & df -P $env:GITHUB_WORKSPACE
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: tools
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/arm-build-diagnostics.yml
            /Generated Files/arm-build/hosted-stock-reference-20261124/
            /Generated Files/arm-build/hosted-devdrive-hobl-source-20261111/
            /Generated Files/arm-build/pipe-matched-ci-readiness/
            /Generated Files/arm-build/hobl-complete-ci/
      - name: Verify reviewed workload and allocation before setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = Join-Path $env:GITHUB_WORKSPACE 'tools'
          $arm = Join-Path $tools 'Generated Files\arm-build'
          $lane = Join-Path $arm 'hosted-stock-reference-20261124'
          & (Join-Path $lane 'Test-StockReference.ps1') -ToolRoot $tools
          $env:HOBL_SOURCE_ROOT = Join-Path $arm 'pipe-matched-ci-readiness'
          & (Join-Path $env:HOBL_SOURCE_ROOT 'queue_readiness.ps1')
          "HOBL_SOURCE_ROOT=$env:HOBL_SOURCE_ROOT" >> $env:GITHUB_ENV
          "HOBL_DRIVER=$(Join-Path $arm 'hosted-devdrive-hobl-source-20261111\controlled_ci.py')" >> $env:GITHUB_ENV
          "HOBL_OUTPUT=$(Join-Path $env:GITHUB_WORKSPACE 'stock-evidence')" >> $env:GITHUB_ENV
          "HOBL_SOURCE=$(Join-Path $env:GITHUB_WORKSPACE 'package-source')" >> $env:GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fastapi/fastapi
          ref: 864b569cf8453654fc3bc2c64108c0f644e2918c
          path: package-source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: matrix.platform == 'macos'
        id: python
        with:
          python-version: "3.13.15"
          architecture: arm64
          update-environment: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.13.6"
          enable-cache: "false"
      - name: Bind the qualified native uv image
        run: |
          $ErrorActionPreference = 'Stop'
          $uv = (Get-Command uv -CommandType Application | Select-Object -First 1).Source
          $actual = (Get-FileHash -LiteralPath $uv).Hash.ToLowerInvariant()
          $expected = if ($env:RUNNER_OS -eq 'Windows') {
            if ([IO.Path]::GetPathRoot($uv) -ine 'C:\') { throw 'Expected uv on C:' }
            'ec27977d62b5f6091bce410a8e69d40d07541803314e0120905c0ad0affaa5cc'
          } else {
            '3996850e6d85e60b0142b40af4bd984822d65f736b52209921c47312450685cb'
          }
          if ($actual -cne $expected) { throw "Unqualified uv image: $actual" }
          "STOCK_UV=$uv" >> $env:GITHUB_ENV
          Write-Output "Qualified uv SHA-256: $actual"
      - name: Install private native Windows Python
        if: matrix.platform == 'windows'
        id: managed-python
        timeout-minutes: 1
        env:
          UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}\managed-python
          UV_CACHE_DIR: ${{ github.workspace }}\managed-python-cache
          UV_HTTP_RETRIES: "0"
          UV_HTTP_TIMEOUT: "20"
        run: |
          $ErrorActionPreference = 'Stop'
          $uv = $env:STOCK_UV
          & $uv python install 3.13.15 --install-dir $env:UV_PYTHON_INSTALL_DIR --no-bin --no-registry --no-config --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $python = & $uv python find 3.13.15 --managed-python --no-python-downloads --no-project --no-config --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $root = [IO.Path]::GetFullPath($env:UV_PYTHON_INSTALL_DIR) + [IO.Path]::DirectorySeparatorChar
          if (-not ([IO.Path]::GetFullPath($python)).StartsWith($root, [StringComparison]::OrdinalIgnoreCase)) {
            throw 'Managed interpreter escaped private installation'
          }
          "python-path=$python" >> $env:GITHUB_OUTPUT
      - name: Prepare the stock common82 workload
        env:
          BASE_PYTHON: ${{ steps.managed-python.outputs.python-path || steps.python.outputs.python-path }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($setting in 'PYTHONPATH', 'PYTHONHOME') {
            if (Test-Path "Env:$setting") { throw "Unexpected Python startup setting: $setting" }
          }
          & $env:BASE_PYTHON -I -B -c "import os, platform, sys; print(sys.version, platform.machine(), os.cpu_count()); sys.exit(sys.version_info[:3] != (3, 13, 15) or platform.machine().lower() not in ('arm64', 'aarch64') or os.cpu_count() != ${{ matrix.workers }})"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $objects = & git -C $env:HOBL_SOURCE rev-parse --path-format=absolute --git-path objects
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($env:RUNNER_OS -eq 'Windows') {
            foreach ($path in @($env:BASE_PYTHON, $env:HOBL_SOURCE, $objects)) {
              $item = Get-Item -Force -LiteralPath $path
              while ($null -ne $item) {
                if ([IO.Path]::GetPathRoot($item.FullName) -ine 'C:\' -or
                    ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
                  throw "Expected a non-reparse C: path: $path"
                }
                $item = if ($item -is [IO.FileInfo]) { $item.Directory } else { $item.Parent }
              }
            }
          }
          Write-Output "Workload inputs: source=$env:HOBL_SOURCE; git objects=$objects; interpreter=$env:BASE_PYTHON; evidence=$env:HOBL_OUTPUT"
          $remaining = [long]$env:MATCHED_JOB_SECONDS - ([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [long]$env:MATCHED_STARTED) - 15
          if ($remaining -le 120) { throw 'No finite preparation allocation remains' }
          & $env:BASE_PYTHON -B $env:HOBL_DRIVER prepare --profile $env:MATCHED_PROFILE --source $env:HOBL_SOURCE --output $env:HOBL_OUTPUT --uv $env:STOCK_UV --workers ${{ matrix.workers }} --seconds $remaining
          exit $LASTEXITCODE
      - name: Measure four complete stock workloads and verify them
        run: |
          $ErrorActionPreference = 'Stop'
          $remaining = [long]$env:MATCHED_JOB_SECONDS - ([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [long]$env:MATCHED_STARTED) - 15
          if ($remaining -le 120) { throw 'No finite workload and audit allocation remains' }
          $python = if ($env:RUNNER_OS -eq 'Windows') { Join-Path $env:HOBL_OUTPUT 'venv\Scripts\python.exe' } else { Join-Path $env:HOBL_OUTPUT 'venv\bin\python' }
          & $python -B $env:HOBL_DRIVER run --profile $env:MATCHED_PROFILE --source $env:HOBL_SOURCE --output $env:HOBL_OUTPUT --uv $env:STOCK_UV --workers ${{ matrix.workers }} --seconds $remaining
          exit $LASTEXITCODE
      - name: Retain phase timings, audit receipts and raw evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: stock-hobl-reference-${{ matrix.platform }}
          path: |
            tools/Generated Files/arm-build/hosted-devdrive-hobl-source-20261111/PARENT-REVIEW.json
            stock-evidence/*.json
            stock-evidence/*.stdout
            stock-evidence/*.stderr
            stock-evidence/*.toml
            stock-evidence/*.txt
            stock-evidence/payload-*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
