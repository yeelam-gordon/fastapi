name: ARM build diagnostics (analysis only)

on:
  workflow_dispatch:

permissions: {}

jobs:
  spare-storage-inventory:
    if: github.repository == 'yeelam-gordon/fastapi' && github.run_attempt == 1
    runs-on: windows-11-arm
    timeout-minutes: 3
    steps:
      - name: Observe spare storage without changing it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
              [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString() -cne 'Arm64') {
            throw 'Inventory requires standard hosted Windows ARM64'
          }
          $disks = @(Get-Disk)
          $partitions = @(Get-Partition)
          $volumes = @(Get-Volume)
          $drives = @(Get-PSDrive -PSProvider FileSystem)
          $mountD = @($volumes | Where-Object DriveLetter -eq 'D')
          $driveDFree = $mountD.Count -eq 0 -and
              @($partitions | Where-Object DriveLetter -eq 'D').Count -eq 0 -and
              @($drives | Where-Object Name -eq 'D').Count -eq 0
          $partitioned = @($partitions | ForEach-Object DiskNumber)
          $spare = @($disks | Where-Object {
            $_.BusType -eq 'NVMe' -and $_.PartitionStyle -eq 'RAW' -and
              -not $_.IsBoot -and -not $_.IsSystem -and
              -not $_.IsOffline -and -not $_.IsReadOnly -and
              $_.NumberOfPartitions -eq 0 -and $_.Size -ge 50GB -and
              $_.Number -notin $partitioned
          })
          $record = [ordered]@{
            commit = $env:GITHUB_SHA
            image = $env:ImageVersion
            attempt = [int]$env:GITHUB_RUN_ATTEMPT
            drive_d_free = $driveDFree
            drive_d_filesystems = @($mountD | ForEach-Object FileSystem)
            raw_nvme_candidates = $spare.Count
            spare_refs_candidate_observed = $driveDFree -and $spare.Count -eq 1
          }
          Write-Host ('HOBL_SPARE_STORAGE ' + ($record | ConvertTo-Json -Compress))
