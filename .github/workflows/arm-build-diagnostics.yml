name: Complete HOBL payload baseline (owned fork, manual)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Complete build plus full covered tests on both ARM hosts.
        type: choice
        options:
          - hobl-complete
          - hobl-macos
          - hobl-paired-uv
          - hobl-paired-runtime
          - hobl-parallel-screen
          - hobl-python-setup-screen
        default: hobl-complete
      windows-python-source:
        description: Optional Windows interpreter source for the parallel screen only.
        type: choice
        options:
          - setup-python
          - uv-managed
        default: setup-python

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"

jobs:
  python-setup-screen:
    if: inputs.platform == 'hobl-python-setup-screen'
    uses: ./.github/workflows/hobl-python-setup-screen.yml

  parallel-screen:
    if: inputs.platform == 'hobl-parallel-screen'
    uses: ./.github/workflows/hobl-parallel-screen.yml
    with:
      windows-python-source: ${{ inputs.windows-python-source }}

  complete:
    if: inputs.platform != 'hobl-parallel-screen' && inputs.platform != 'hobl-python-setup-screen' && github.repository == 'yeelam-gordon/fastapi' && github.run_attempt == '1'
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(
            inputs.platform == 'hobl-paired-runtime' &&
            '[{"runner":"windows-11-arm","platform":"windows"},{"runner":"macos-14","platform":"macos"}]' ||
            inputs.platform == 'hobl-macos' &&
            '[{"runner":"macos-15","platform":"macos"}]' ||
            '[{"runner":"windows-11-arm","platform":"windows"},{"runner":"macos-15","platform":"macos"}]'
          ) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /Generated Files/.gitattributes
            /Generated Files/arm-build/.gitattributes
            /Generated Files/arm-build/hobl-complete-ci/
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fastapi/fastapi
          ref: 864b569cf8453654fc3bc2c64108c0f644e2918c
          path: package-source
          persist-credentials: false
      - name: Native macOS Python
        if: matrix.platform == 'macos'
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12.10"
          architecture: arm64
          update-environment: false
      - name: Native candidate runtime (optional paired runtime)
        if: inputs.platform == 'hobl-paired-runtime'
        id: candidate
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.15"
          architecture: arm64
          update-environment: false
      - name: Native runtime and owned venv
        env:
          HOBL_MODE: ${{ inputs.platform }}
          HOBL_MAC_PYTHON: ${{ steps.python.outputs.python-path }}
          HOBL_CANDIDATE_BASE: ${{ steps.candidate.outputs.python-path }}
        run: |
          & 'tools/Generated Files/arm-build/hobl-complete-ci/bootstrap.ps1'
          exit $LASTEXITCODE
      - name: Prepare complete timed-payload dependencies outside measurements
        env:
          HOBL_MODE: ${{ inputs.platform }}
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'package-source'
          $helper = Join-Path $env:GITHUB_WORKSPACE 'tools/Generated Files/arm-build/hobl-complete-ci'
          $env:PIP_INDEX_URL = 'https://pypi.org/simple'
          $env:PIP_DISABLE_PIP_VERSION_CHECK = '1'
          $env:PIP_CACHE_DIR = Join-Path $env:HOBL_ROOT 'setup-cache'
          Set-Location -LiteralPath $source
          if ($env:HOBL_MODE -eq 'hobl-paired-runtime') {
            $env:PIP_CONSTRAINT = & $env:HOBL_BASE_PYTHON -I -B -c "from pathlib import Path; import sys; print(Path(sys.argv[1]).absolute().as_uri())" (Join-Path $helper 'build-constraints.txt')
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            & $env:HOBL_BASE_PYTHON -I -B (Join-Path $helper 'runtime_pair.py') prepare $source $env:HOBL_ROOT
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            foreach ($python in @($env:HOBL_PYTHON, $env:HOBL_CANDIDATE_PYTHON)) {
              & $python -m pip install --only-binary=:all: --retries 0 --timeout 45 --index-url $env:PIP_INDEX_URL -c (Join-Path $helper 'runtime-constraints.txt') -r requirements-tests.txt build pip pdm-backend uv==0.13.6
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
              & $python -m pip check
              if ($LASTEXITCODE) { exit $LASTEXITCODE }
            }
            & $env:HOBL_PYTHON (Join-Path $helper 'prepare_uv.py') (Join-Path $env:HOBL_ROOT 'uv-identity.json')
            exit $LASTEXITCODE
          }
          & $env:HOBL_PYTHON -m pip install --retries 1 --timeout 45 --index-url $env:PIP_INDEX_URL -c (Join-Path $helper 'runtime-constraints.txt') -r requirements-tests.txt build pip pdm-backend
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($env:HOBL_MODE -eq 'hobl-paired-uv') {
            & $env:HOBL_PYTHON -m pip install --only-binary=:all: --retries 1 --timeout 45 --index-url $env:PIP_INDEX_URL -c (Join-Path $helper 'runtime-constraints.txt') uv==0.13.6
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            & $env:HOBL_PYTHON (Join-Path $helper 'prepare_uv.py') (Join-Path $env:HOBL_ROOT 'uv-identity.json')
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          & $env:HOBL_PYTHON -m pip check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:HOBL_SOURCE = $source
          $manifest = Join-Path $env:HOBL_ROOT 'source-files.json'
          $env:HOBL_MANIFEST = $manifest
          @'
          import hashlib,json,os,subprocess
          from pathlib import Path
          source=Path(os.environ["HOBL_SOURCE"])
          head=subprocess.run(["git","-C",str(source),"rev-parse","HEAD"],check=True,capture_output=True,text=True).stdout.strip()
          if head!="864b569cf8453654fc3bc2c64108c0f644e2918c":raise RuntimeError("Source commit mismatch")
          names=subprocess.run(["git","-C",str(source),"ls-files","-z"],check=True,capture_output=True).stdout.decode().split("\0")
          manifest={name:hashlib.sha256((source/name).read_bytes()).hexdigest() for name in names if name}
          Path(os.environ["HOBL_MANIFEST"]).write_text(json.dumps(manifest,indent=2)+"\n",encoding="utf-8")
          '@ | & $env:HOBL_PYTHON -
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify workload and score contracts
        run: |
          $helper = Join-Path $env:GITHUB_WORKSPACE 'tools/Generated Files/arm-build/hobl-complete-ci'
          & $env:HOBL_BASE_PYTHON -B -m unittest discover -s $helper -p 'test_*.py'
          exit $LASTEXITCODE
      - name: Complete HOBL payload iterations (optional paired frontend)
        env:
          HOBL_STYLE: ${{ matrix.platform }}
          HOBL_MODE: ${{ inputs.platform }}
        run: |
          $helper = Join-Path $env:GITHUB_WORKSPACE 'tools/Generated Files/arm-build/hobl-complete-ci'
          $paired = @()
          if ($env:HOBL_MODE -in @('hobl-paired-uv', 'hobl-paired-runtime')) {
            $identity = Get-Content -Raw (Join-Path $env:HOBL_ROOT 'uv-identity.json') | ConvertFrom-Json
            $paired = @('--paired-uv', $identity.executable)
            if ($env:HOBL_MODE -eq 'hobl-paired-runtime') {
              $paired += @('--candidate-python', $env:HOBL_CANDIDATE_PYTHON)
            }
          }
          & $env:HOBL_BASE_PYTHON -I -B (Join-Path $helper 'run_payload.py') `
            --source (Join-Path $env:GITHUB_WORKSPACE 'package-source') `
            --python $env:HOBL_PYTHON `
            --output (Join-Path $env:HOBL_ROOT 'evidence') `
            --manifest (Join-Path $env:HOBL_ROOT 'source-files.json') `
            --guardian (Join-Path $helper 'owned_process.py') `
            --loops 5 --style $env:HOBL_STYLE --index https://pypi.org/simple @paired
          exit $LASTEXITCODE
      - name: Preserve complete payload phase results and failures
        if: always() && env.HOBL_ROOT != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hobl-complete-${{ matrix.platform }}
          path: |
            ${{ env.HOBL_ROOT }}/bootstrap.json
            ${{ env.HOBL_ROOT }}/uv-identity.json
            ${{ env.HOBL_ROOT }}/source-files.json
            ${{ inputs.platform == 'hobl-paired-runtime' && format('{0}/original-source-files.json', env.HOBL_ROOT) || '' }}
            ${{ inputs.platform == 'hobl-paired-runtime' && format('{0}/common-source.json', env.HOBL_ROOT) || '' }}
            ${{ inputs.platform == 'hobl-paired-runtime' && format('{0}/evidence/*runtime-identity.json', env.HOBL_ROOT) || '' }}
            ${{ inputs.platform == 'hobl-paired-runtime' && format('{0}/evidence/loop-*/private/*', env.HOBL_ROOT) || '' }}
            ${{ inputs.platform == 'hobl-paired-runtime' && format('{0}/evidence/loop-*/private/.coverage.*', env.HOBL_ROOT) || '' }}
            ${{ env.HOBL_ROOT }}/evidence/result.json
            ${{ env.HOBL_ROOT }}/evidence/loops.json
            ${{ env.HOBL_ROOT }}/evidence/identity.json
            ${{ env.HOBL_ROOT }}/evidence/identity.stdout
            ${{ env.HOBL_ROOT }}/evidence/identity.stderr
            ${{ env.HOBL_ROOT }}/evidence/ownership-summary.json
            ${{ env.HOBL_ROOT }}/evidence/ownership.json
            ${{ env.HOBL_ROOT }}/evidence/uv-identity.json
            ${{ env.HOBL_ROOT }}/evidence/paired-config.json
            ${{ env.HOBL_ROOT }}/evidence/driver.stdout
            ${{ env.HOBL_ROOT }}/evidence/driver.stderr
            ${{ env.HOBL_ROOT }}/evidence/loop-*/*.json
            ${{ env.HOBL_ROOT }}/evidence/loop-*/*.stdout
            ${{ env.HOBL_ROOT }}/evidence/loop-*/*.stderr
            ${{ env.HOBL_ROOT }}/evidence/loop-*/artifacts/*
            ${{ (inputs.platform == 'hobl-paired-uv' || inputs.platform == 'hobl-paired-runtime') && format('{0}/package-source/dist/*', github.workspace) || '' }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
