name: ARM build diagnostics (analysis only)

on:
  workflow_dispatch:

permissions: {}

jobs:
  volume-inventory:
    if: github.repository == 'yeelam-gordon/fastapi' && github.run_attempt == 1
    runs-on: windows-11-arm
    timeout-minutes: 3
    steps:
      - name: Observe existing mounted volumes without writing to them
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($architecture -cne 'Arm64' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'Inventory requires a GitHub-hosted Windows ARM64 runner'
          }
          $volumes = @(Get-Volume | Where-Object DriveType -eq 'Fixed')
          $workspaceDrive = [IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE).Substring(0, 1)
          $workspace = @($volumes | Where-Object DriveLetter -eq $workspaceDrive)
          if ($workspace.Count -ne 1 -or -not $workspace[0].FileSystem) {
            throw 'Unable to identify the workspace filesystem'
          }
          $record = [ordered]@{
            schema = 1
            attempt = [int]$env:GITHUB_RUN_ATTEMPT
            commit = $env:GITHUB_SHA
            architecture = $architecture
            image_os = $env:ImageOS
            image_version = $env:ImageVersion
            workspace_filesystem = [string]$workspace[0].FileSystem
            fixed_volumes = @($volumes | ForEach-Object {
              [ordered]@{
                letter = [string]$_.DriveLetter
                filesystem = [string]$_.FileSystem
                health = [string]$_.HealthStatus
                available_bytes = [long]$_.SizeRemaining
              }
            })
          }
          Write-Host ('HOBL_VOLUME_INVENTORY ' + ($record | ConvertTo-Json -Depth 4 -Compress))
