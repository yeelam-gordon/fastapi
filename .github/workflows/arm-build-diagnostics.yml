name: ARM build diagnostics (analysis only)

on:
  workflow_dispatch:

permissions: {}

jobs:
  volume-inventory:
    if: github.repository == 'yeelam-gordon/fastapi' && github.run_attempt == 1
    runs-on: windows-11-arm
    timeout-minutes: 3
    steps:
      - name: Observe storage placement without changing it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([DateTimeOffset]::UtcNow -lt [DateTimeOffset]'2026-12-03T00:00:00Z') {
            throw 'Inventory is reserved for after the announced rollout window'
          }
          $architecture = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($architecture -cne 'Arm64' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'Inventory requires a standard hosted Windows ARM64 runner'
          }
          $volumes = @(Get-Volume | Where-Object DriveType -eq 'Fixed')
          function Get-Placement([string]$name) {
            $path = [Environment]::GetEnvironmentVariable($name)
            if ($path -notmatch '^[a-zA-Z]:\\') {
              throw "Expected a drive-letter path for $name"
            }
            $item = Get-Item -Force -LiteralPath $path -ErrorAction SilentlyContinue
            if ($item -isnot [IO.DirectoryInfo]) {
              throw "Expected an existing directory for $name"
            }
            $letter = $item.FullName.Substring(0, 1).ToUpperInvariant()
            while ($null -ne $item) {
              if ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) {
                throw "Cannot attribute $name through a reparse point"
              }
              $item = $item.Parent
            }
            $volume = @($volumes | Where-Object DriveLetter -eq $letter)
            if ($volume.Count -ne 1 -or -not $volume[0].FileSystem) {
              throw "Unable to identify the fixed volume for $name"
            }
            [ordered]@{
              drive = $letter
              filesystem = [string]$volume[0].FileSystem
              health = [string]$volume[0].HealthStatus
            }
          }
          $placement = [ordered]@{
            workspace = Get-Placement 'GITHUB_WORKSPACE'
            runner_temp = Get-Placement 'RUNNER_TEMP'
            process_temp = Get-Placement 'TEMP'
            tool_cache = Get-Placement 'RUNNER_TOOL_CACHE'
          }
          $record = [ordered]@{
            schema = 1
            attempt = [int]$env:GITHUB_RUN_ATTEMPT
            commit = $env:GITHUB_SHA
            architecture = $architecture
            image_os = $env:ImageOS
            image_version = $env:ImageVersion
            placement = $placement
            fixed_volumes = @($volumes | Where-Object DriveLetter | ForEach-Object {
              [ordered]@{
                drive = [string]$_.DriveLetter
                filesystem = [string]$_.FileSystem
                health = [string]$_.HealthStatus
                available_bytes = [long]$_.SizeRemaining
              }
            })
            announced_workspace_observed = (
              $placement.workspace.drive -ceq 'D' -and
              $placement.workspace.filesystem -ceq 'ReFS' -and
              $placement.workspace.health -ceq 'Healthy'
            )
          }
          Write-Host ('HOBL_STORAGE_ROLLOUT ' + ($record | ConvertTo-Json -Depth 4 -Compress))
