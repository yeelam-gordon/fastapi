name: Windows ARM Python setup SCREEN (not HOBL qualification)

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  screen:
    if: github.repository == 'yeelam-gordon/fastapi' && github.run_attempt == '1'
    runs-on: windows-11-arm
    timeout-minutes: 4
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /Generated Files/.gitattributes
            /Generated Files/arm-build/.gitattributes
            /Generated Files/arm-build/hobl-complete-ci/owned_process.py
            /Generated Files/arm-build/hobl-python-setup-screen/
      - name: Record initial exact stock tool cache
        id: cache
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'setup-evidence'
          New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
          $exe = Join-Path $env:RUNNER_TOOL_CACHE 'Python\3.13.15\arm64\python.exe'
          $marker = Join-Path $env:RUNNER_TOOL_CACHE 'Python\3.13.15\arm64.complete'
          $hasExe = Test-Path -LiteralPath $exe -PathType Leaf
          $hasMarker = Test-Path -LiteralPath $marker -PathType Leaf
          @{ python = $exe; marker = $marker; python_exists = $hasExe; marker_exists = $hasMarker; initially_cached = ($hasExe -and $hasMarker); utc = [DateTime]::UtcNow.ToString('o') } |
            ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $root 'initial-cache.json')
          "present=$($hasExe -and $hasMarker)".ToLowerInvariant() >> $env:GITHUB_OUTPUT
      - name: Stock exact native Python
        id: stock
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.15"
          architecture: arm64
          update-environment: false
      - name: Pinned native uv (cold comparison only)
        if: steps.cache.outputs.present == 'false'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.13.6"
          enable-cache: "false"
      - name: Bounded private install and basic native identities
        env:
          STOCK_PYTHON: ${{ steps.stock.outputs.python-path }}
        run: |
          $helper = Join-Path $env:GITHUB_WORKSPACE 'Generated Files\arm-build\hobl-python-setup-screen\screen.py'
          $uv = if ((Get-Content -Raw 'setup-evidence\initial-cache.json' | ConvertFrom-Json).initially_cached) { '' } else { (Get-Command uv -ErrorAction Stop).Source }
          & $env:STOCK_PYTHON -B $helper run (Join-Path $env:GITHUB_WORKSPACE 'setup-evidence') $uv
          exit $LASTEXITCODE
      - name: Preserve setup-only raw evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hobl-python-setup-screen-windows-arm
          path: |
            setup-evidence/*.json
            setup-evidence/*.stdout
            setup-evidence/*.stderr
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
