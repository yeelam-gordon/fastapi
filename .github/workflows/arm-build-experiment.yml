name: P63 bounded capture and schema validation (manual only)

on:
  workflow_dispatch:
    inputs:
      authority:
        description: One separately approved fresh-VM capture/schema attempt; accepts transient overshoot
        required: true
        type: choice
        options:
          - P63_ONE_EPHEMERAL_ATTEMPT

permissions: {}

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"
  NoDefaultCurrentDirectoryInExePath: "1"

jobs:
  capture-schema:
    name: p63-capture-schema
    if: github.repository == 'yeelam-gordon/fastapi' && github.ref == 'refs/heads/perf/arm-scan-schema' && github.run_attempt == 1 && inputs.authority == 'P63_ONE_EPHEMERAL_ATTEMPT'
    runs-on: windows-11-arm
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      id-token: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Generated Files/arm-build/p63-capture-schema/
            /Generated Files/arm-build/paired-arm-reference/frontend.py
            /Generated Files/arm-build/paired-arm-reference/frozen.py
            /Generated Files/arm-build/paired-arm-reference/compare.py
            /Generated Files/arm-build/paired-arm-reference/guards.py
            /Generated Files/arm-build/paired-arm-reference/driver.py
            /Generated Files/arm-build/paired-arm-reference/installer.py
            /Generated Files/arm-build/paired-arm-reference/source.py
            /Generated Files/arm-build/paired-arm-reference/cpu_audit.py
            /Generated Files/arm-build/paired-arm-reference/bootstrap.ps1
            /Generated Files/arm-build/protocol/owned_process.py
      - name: One private bootstrap and guarded controller invocation
        env:
          GH_TOKEN: ${{ github.token }}
          P63_AUTHORIZATION: ${{ inputs.authority }}
        run: |
          & 'tools\Generated Files\arm-build\p63-capture-schema\hosted.ps1'
          exit $LASTEXITCODE
      - name: Preserve only finite classified public JSON
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: p63-capture-schema-public
          path: ${{ github.workspace }}/p63-public/public-result.json
          if-no-files-found: error
          retention-days: 3
      - name: Preserve failure after publication
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          $code = 2
          $path = Join-Path $env:GITHUB_WORKSPACE 'p63-private-hosted\final-exit-code.json'
          try {
            if (Test-Path -LiteralPath $path) {
              $receipt = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
              if ($receipt.exit_code -is [long] -or $receipt.exit_code -is [int]) {
                if ($receipt.exit_code -gt 0 -and $receipt.exit_code -le 255) { $code = [int]$receipt.exit_code }
              }
            }
          } catch {}
          exit $code
