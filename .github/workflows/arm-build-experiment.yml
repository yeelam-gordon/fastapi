name: ARM build experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.6"
          enable-cache: "false"
      - name: Resolve identical hash-locked dependencies for both platforms
        run: |
          uv pip compile --universal --python-version 3.13 --generate-hashes --no-build --output-file "Generated Files/arm-build/tooling.lock" "Generated Files/arm-build/tooling.in"
          uv pip compile --universal --python-version 3.13 --generate-hashes --no-build --output-file "Generated Files/arm-build/smoke.lock" "Generated Files/arm-build/smoke.in"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: experiment-locks
          path: Generated Files/arm-build/*.lock
          if-no-files-found: error
  measure:
    needs: resolve
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-11-arm, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
          architecture: arm64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: experiment-locks
          path: Generated Files/arm-build
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.6"
          enable-cache: "false"
      - name: Provision pinned native tools and offline wheelhouse
        run: python "Generated Files/arm-build/ci_prepare.py"
      - name: Upload Windows ARM offline dependencies
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-arm-wheelhouse
          path: Generated Files/arm-build/wheelhouse
          if-no-files-found: error
          retention-days: 7
      - name: Verify benchmark logic
        run: python "Generated Files/arm-build/test_benchmark.py"
      - name: Measure complete PDM builds
        run: python "Generated Files/arm-build/benchmark.py" --uv uv --repeats 7 --output "Generated Files/arm-build/results/ci" --importtime
      - name: Install built wheel and run artifact smoke check
        run: python "Generated Files/arm-build/ci_prepare.py" --smoke
      - name: Check experiment Python formatting
        run: python -m ruff check "Generated Files/arm-build/benchmark.py" "Generated Files/arm-build/test_benchmark.py" "Generated Files/arm-build/ci_prepare.py" --output-format github
      - name: Upload measurements even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: arm-build-${{ matrix.os }}
          path: |
            Generated Files/arm-build/results/ci/report.json
            Generated Files/arm-build/results/ci/harness.py
            Generated Files/arm-build/results/ci/logs
            Generated Files/arm-build/results/ci/artifacts/*.manifest.json
            Generated Files/arm-build/results/ci/build-constraints.txt
            Generated Files/arm-build/results/ci/artifacts/prepare-baseline/*.whl
            Generated Files/arm-build/results/ci/artifacts/prepare-baseline/*.tar.gz
            Generated Files/arm-build/results/bootstrap
          if-no-files-found: error
          retention-days: 14
