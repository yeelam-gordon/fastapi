name: ARM volume inventory (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    if: github.repository == 'yeelam-gordon/fastapi'
    runs-on: windows-11-arm
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Inventory existing fixed volumes and ARM host identity
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $osArch = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          $processArch = [Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
          if (-not [Runtime.InteropServices.RuntimeInformation]::IsOSPlatform([Runtime.InteropServices.OSPlatform]::Windows) -or
              $osArch -ne 'Arm64' -or $processArch -ne 'Arm64') { throw 'Native Windows ARM64 required' }
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'ARM64') { throw 'Runner identity mismatch' }
          if (-not [IO.Path]::IsPathFullyQualified($env:RUNNER_TEMP) -or
              -not (Test-Path -LiteralPath $env:RUNNER_TEMP -PathType Container)) { throw 'Invalid runner temp' }
          $outputRoot = Join-Path $env:RUNNER_TEMP 'arm-volume-inventory'
          if (Test-Path -LiteralPath $outputRoot) { throw 'Inventory output already exists' }
          $volumes = @(Get-Volume -ErrorAction Stop | Where-Object { $_.DriveLetter -and $_.DriveType -eq 'Fixed' } |
            ForEach-Object {
              [ordered]@{
                driveLetter = [string]$_.DriveLetter
                fileSystem = [string]$_.FileSystem
                driveType = [string]$_.DriveType
                healthStatus = [string]$_.HealthStatus
                sizeBytes = [long]$_.Size
                freeBytes = [long]$_.SizeRemaining
              }
            })
          $processors = @(Get-CimInstance -ClassName Win32_Processor -ErrorAction Stop | ForEach-Object {
            [ordered]@{
              name = $_.Name
              coreCount = $_.NumberOfCores
              logicalProcessorCount = $_.NumberOfLogicalProcessors
            }
          })
          $os = Get-CimInstance -ClassName Win32_OperatingSystem -ErrorAction Stop
          if (-not $volumes.Count -or -not $processors.Count -or -not $os.BuildNumber) { throw 'Incomplete inventory' }
          $inventory = [ordered]@{
            schemaVersion = 1
            os = [ordered]@{
              architecture = $osArch
              processArchitecture = $processArch
              version = $os.Version
              build = $os.BuildNumber
              imageOS = $env:ImageOS
              imageVersion = $env:ImageVersion
            }
            processors = $processors
            runner = [ordered]@{
              os = $env:RUNNER_OS
              architecture = $env:RUNNER_ARCH
              workspace = $env:GITHUB_WORKSPACE
              temp = $env:RUNNER_TEMP
            }
            volumes = $volumes
          }
          $json = $inventory | ConvertTo-Json -Depth 6
          New-Item -ItemType Directory -Path $outputRoot -ErrorAction Stop | Out-Null
          $json | Set-Content -LiteralPath (Join-Path $outputRoot 'inventory.json') -Encoding utf8 -ErrorAction Stop
      - name: Upload inventory JSON only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: arm-volume-inventory
          path: ${{ runner.temp }}\arm-volume-inventory\inventory.json
          if-no-files-found: error
          retention-days: 7
