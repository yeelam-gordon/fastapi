name: Paired ARM build experiment v4 (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"

jobs:
  windows:
    runs-on: windows-11-arm
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Require Git sparse checkout support before checkout
        run: |
          $git = Get-Command git -ErrorAction Stop
          $version = & $git.Source version
          if ($LASTEXITCODE -or $version -notmatch '(\d+\.\d+(?:\.\d+)?)' -or [version]$Matches[1] -lt [version]'2.28') {
            throw 'Git >= 2.28 is required; archive fallback is not permitted'
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /.github/.gitattributes
            /.github/workflows/.gitattributes
            /.github/workflows/arm-build-experiment.yml
            /Generated Files/.gitattributes
            /Generated Files/arm-build/.gitattributes
            /Generated Files/arm-build/*.lock
            /Generated Files/arm-build/setup_python.cjs
            /Generated Files/arm-build/ci_prepare.py
            /Generated Files/arm-build/candidate/.gitattributes
            /Generated Files/arm-build/candidate/*.py
            /Generated Files/arm-build/candidate/actual-manifest.json
            /Generated Files/arm-build/protocol/.gitattributes
            /Generated Files/arm-build/protocol/*.py
            /Generated Files/arm-build/protocol/owned_process.py
            /Generated Files/arm-build/protocol/*.lock
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 79cab5bed28b24d92c185d236feb33f5783dfeb3
          path: package-source
          persist-credentials: false
      - name: Place complete experiment on C without changing volume trust
        run: |
          $started = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds() / 1000.0
          "PAIR_PROVISION_STARTED=$($started.ToString([Globalization.CultureInfo]::InvariantCulture))" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $required = @(
            '.github/workflows/arm-build-experiment.yml'
            'Generated Files/arm-build/setup_python.cjs'
            'Generated Files/arm-build/ci_prepare.py'
            'Generated Files/arm-build/tooling.lock'
            'Generated Files/arm-build/smoke.lock'
            'Generated Files/arm-build/candidate/actual-manifest.json'
            'Generated Files/arm-build/protocol/isolated_build.py'
            'Generated Files/arm-build/protocol/backend.lock'
            'Generated Files/arm-build/protocol/owned_process.py'
          )
          $required += git -C tools ls-files -- ':(glob)Generated Files/arm-build/candidate/*.py' ':(glob)Generated Files/arm-build/protocol/*.py' ':(glob)Generated Files/arm-build/protocol/*.lock' ':(glob)Generated Files/arm-build/*.lock'
          if ($LASTEXITCODE) { throw 'Cannot enumerate complete tool hash inputs' }
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path tools $file) -PathType Leaf)) {
              throw "Required sparse tool input missing: $file"
            }
          }
          $root = "C:\arm-pairs-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory $root -ErrorAction Stop | Out-Null
          Copy-Item -Recurse -Force tools (Join-Path $root 'tools')
          Copy-Item -Recurse -Force package-source (Join-Path $root 'package-source')
          @(
            "PAIR_ROOT=$root"
            "PAIR_TOOLS=$(Join-Path $root 'tools')"
            "UV_CACHE_DIR=$(Join-Path $root 'uv-cache')"
            "UV_PYTHON_INSTALL_DIR=$(Join-Path $root 'python')"
            "PIP_CACHE_DIR=$(Join-Path $root 'pip-cache')"
            "TEMP=$root"
            "TMP=$root"
          ) | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.13.6"
          enable-cache: "false"
      - name: Pin native runtime and prepare locked offline wheels
        run: |
          $uv = Join-Path $env:PAIR_ROOT 'uv.exe'
          Copy-Item (Get-Command uv).Source $uv
          $env:PATH = "$env:PAIR_ROOT;$env:PATH"
          "PAIR_UV=$uv" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $arm = Join-Path (Join-Path $env:PAIR_TOOLS 'Generated Files') 'arm-build'
          node (Join-Path $arm 'setup_python.cjs')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Prepare canonical source and run fixed protocol
        run: |
          $protocol = Join-Path (Join-Path (Join-Path $env:PAIR_TOOLS 'Generated Files') 'arm-build') 'protocol'
          python (Join-Path $protocol 'test_pairs.py')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python (Join-Path $protocol 'measure_pairs.py') --prepare --uv $env:PAIR_UV --source-checkout (Join-Path $env:PAIR_ROOT 'package-source') --output (Join-Path $env:PAIR_ROOT 'evidence')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python (Join-Path $protocol 'measure_pairs.py') --uv $env:PAIR_UV --output (Join-Path $env:PAIR_ROOT 'evidence')
          exit $LASTEXITCODE
      - name: Preserve complete v4 evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: paired-v4-windows
          path: |
            ${{ env.PAIR_ROOT }}/evidence
            ${{ env.PAIR_TOOLS }}/Generated Files/arm-build/results/bootstrap
          if-no-files-found: error
          retention-days: 14

  macos:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Require Git sparse checkout support before checkout
        run: |
          $git = Get-Command git -ErrorAction Stop
          $version = & $git.Source version
          if ($LASTEXITCODE -or $version -notmatch '(\d+\.\d+(?:\.\d+)?)' -or [version]$Matches[1] -lt [version]'2.28') {
            throw 'Git >= 2.28 is required; archive fallback is not permitted'
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /.github/.gitattributes
            /.github/workflows/.gitattributes
            /.github/workflows/arm-build-experiment.yml
            /Generated Files/.gitattributes
            /Generated Files/arm-build/.gitattributes
            /Generated Files/arm-build/*.lock
            /Generated Files/arm-build/setup_python.cjs
            /Generated Files/arm-build/ci_prepare.py
            /Generated Files/arm-build/candidate/.gitattributes
            /Generated Files/arm-build/candidate/*.py
            /Generated Files/arm-build/candidate/actual-manifest.json
            /Generated Files/arm-build/protocol/.gitattributes
            /Generated Files/arm-build/protocol/*.py
            /Generated Files/arm-build/protocol/owned_process.py
            /Generated Files/arm-build/protocol/*.lock
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 79cab5bed28b24d92c185d236feb33f5783dfeb3
          path: package-source
          persist-credentials: false
      - name: Prepare owned experiment root
        run: |
          $started = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds() / 1000.0
          "PAIR_PROVISION_STARTED=$($started.ToString([Globalization.CultureInfo]::InvariantCulture))" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $required = @(
            '.github/workflows/arm-build-experiment.yml'
            'Generated Files/arm-build/setup_python.cjs'
            'Generated Files/arm-build/ci_prepare.py'
            'Generated Files/arm-build/tooling.lock'
            'Generated Files/arm-build/smoke.lock'
            'Generated Files/arm-build/candidate/actual-manifest.json'
            'Generated Files/arm-build/protocol/isolated_build.py'
            'Generated Files/arm-build/protocol/backend.lock'
            'Generated Files/arm-build/protocol/owned_process.py'
          )
          $required += git -C tools ls-files -- ':(glob)Generated Files/arm-build/candidate/*.py' ':(glob)Generated Files/arm-build/protocol/*.py' ':(glob)Generated Files/arm-build/protocol/*.lock' ':(glob)Generated Files/arm-build/*.lock'
          if ($LASTEXITCODE) { throw 'Cannot enumerate complete tool hash inputs' }
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath (Join-Path tools $file) -PathType Leaf)) {
              throw "Required sparse tool input missing: $file"
            }
          }
          $root = Join-Path $env:GITHUB_WORKSPACE "arm-pairs-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory $root -ErrorAction Stop | Out-Null
          Copy-Item -Recurse -Force tools (Join-Path $root 'tools')
          Copy-Item -Recurse -Force package-source (Join-Path $root 'package-source')
          @(
            "PAIR_ROOT=$root"
            "PAIR_TOOLS=$(Join-Path $root 'tools')"
            "UV_CACHE_DIR=$(Join-Path $root 'uv-cache')"
            "UV_PYTHON_INSTALL_DIR=$(Join-Path $root 'python')"
            "PIP_CACHE_DIR=$(Join-Path $root 'pip-cache')"
            "TMPDIR=$root"
          ) | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.13.6"
          enable-cache: "false"
      - name: Pin native runtime
        run: |
          $uv = Join-Path $env:PAIR_ROOT 'uv'
          Copy-Item (Get-Command uv).Source $uv
          $env:PATH = "$env:PAIR_ROOT`:$env:PATH"
          "PAIR_UV=$uv" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $arm = Join-Path (Join-Path $env:PAIR_TOOLS 'Generated Files') 'arm-build'
          node (Join-Path $arm 'setup_python.cjs')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Prepare canonical source and run fixed protocol
        run: |
          $protocol = Join-Path (Join-Path (Join-Path $env:PAIR_TOOLS 'Generated Files') 'arm-build') 'protocol'
          python (Join-Path $protocol 'test_pairs.py')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python (Join-Path $protocol 'measure_pairs.py') --prepare --uv $env:PAIR_UV --source-checkout (Join-Path $env:PAIR_ROOT 'package-source') --output (Join-Path $env:PAIR_ROOT 'evidence')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python (Join-Path $protocol 'measure_pairs.py') --uv $env:PAIR_UV --output (Join-Path $env:PAIR_ROOT 'evidence')
          exit $LASTEXITCODE
      - name: Preserve complete v4 evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: paired-v4-macos
          path: |
            ${{ env.PAIR_ROOT }}/evidence
            ${{ env.PAIR_TOOLS }}/Generated Files/arm-build/results/bootstrap
          if-no-files-found: error
          retention-days: 14
