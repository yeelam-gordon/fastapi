name: Exact locked publisher wheel acquisition (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    if: github.repository == 'yeelam-gordon/fastapi' && github.ref == 'refs/heads/perf/locked-wheel-acquisition-20261031' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Generated Files/arm-build/package-acquisition/acquire.py
      - name: Acquire exact publisher bytes without installing the package
        run: python3 -I -B 'Generated Files/arm-build/package-acquisition/acquire.py' --output download
      - name: Preserve exact wheel or original failure receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: exact-graphql-core-3.3.1
          path: download
          if-no-files-found: error
          retention-days: 3
