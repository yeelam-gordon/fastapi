name: ARM mounted-volume coverage (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    if: github.repository == 'yeelam-gordon/fastapi'
    runs-on: windows-11-arm
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        id: checkout
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Generated Files/arm-build/hosted-mounted-volume-readiness/candidate/Collect-MountedVolumes.ps1
      - name: Validate source identity and collect metadata only
        id: collection
        env:
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          try {
            $head = (& git rev-parse HEAD 2>$null)
            if ($LASTEXITCODE -ne 0 -or $head -ne $env:EXPECTED_SOURCE_COMMIT) { exit 2 }
            $source = Join-Path $env:GITHUB_WORKSPACE 'Generated Files\arm-build\hosted-mounted-volume-readiness\candidate\Collect-MountedVolumes.ps1'
            $expected = 'BACEF9482F915FD4EBD998C2E4BC1C337F659AC4BC18E93387459BF3D2BDAD10'
            if ((Get-FileHash -LiteralPath $source -Algorithm SHA256 -ErrorAction Stop).Hash -ne $expected) { exit 2 }
            . $source
            $collectionExit = Invoke-HostedMountedVolumeCollection
            if ($collectionExit -notin @(0, 1)) { exit 2 }
            if ($collectionExit -eq 1) { Write-Output 'UNKNOWN: sanitized evidence created; final verdict will fail the job.' }
          } catch {
            Write-Output 'UNKNOWN: source or collection boundary failed; no raw error exported.'
            exit 2
          }
      - name: Upload exact sanitized JSON, including UNKNOWN evidence
        if: ${{ always() && steps.collection.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: p75-mounted-volume-coverage
          path: ${{ runner.temp }}\p75-mounted-volumes.json
          if-no-files-found: error
          retention-days: 7
      - name: Require observed coverage after preserving sanitized evidence
        if: ${{ always() && steps.collection.outcome == 'success' }}
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $evidence = Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'p75-mounted-volumes.json') -Raw -ErrorAction Stop | ConvertFrom-Json -ErrorAction Stop
            if ($evidence.schemaVersion -ne 1 -or $evidence.status -ne 'OBSERVED') {
              Write-Output 'UNKNOWN: mounted-volume coverage is incomplete; job fails.'
              exit 1
            }
          } catch {
            Write-Output 'UNKNOWN: evidence boundary failed; job fails without raw error details.'
            exit 2
          }
