name: Copy versus native-default link build screen (not adoption)

on:
  workflow_call:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: "false"

jobs:
  screen:
    if: github.repository == 'yeelam-gordon/fastapi' && github.ref == 'refs/heads/perf/native-link-build-20261104' && github.event_name == 'workflow_dispatch' && github.run_attempt == '1'
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: windows-11-arm
            platform: windows
            workers: 4
          - runner: macos-15
            platform: macos
            workers: 3
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /Generated Files/.gitattributes
            /Generated Files/arm-build/.gitattributes
            /Generated Files/arm-build/hobl-complete-ci/
            /Generated Files/arm-build/hobl-parallel-screen/
            /Generated Files/arm-build/hobl-secure-wipe-screen/
            /Generated Files/arm-build/native-link-build-screen/
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fastapi/fastapi
          ref: 864b569cf8453654fc3bc2c64108c0f644e2918c
          path: package-source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        id: python
        with:
          python-version: "3.13.15"
          architecture: arm64
          update-environment: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: "0.13.6"
          enable-cache: "false"
      - name: Common pinned82 preparation (outside both build clocks)
        env:
          BASE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          $prepared = Join-Path $env:GITHUB_WORKSPACE 'prepared'
          New-Item -ItemType Directory -Path $prepared -ErrorAction Stop | Out-Null
          $helper = Join-Path $env:GITHUB_WORKSPACE 'tools/Generated Files/arm-build/hobl-parallel-screen/screen.py'
          & $env:BASE_PYTHON $helper prepare --source (Join-Path $env:GITHUB_WORKSPACE 'package-source') --output $prepared --uv (Get-Command uv).Source --workers ${{ matrix.workers }}
          $code = $LASTEXITCODE
          @{ seconds = $timer.Elapsed.TotalSeconds; exitcode = $code; scope = 'common preparation outside both build clocks' } | ConvertTo-Json | Set-Content (Join-Path $prepared 'setup-timing.json')
          exit $code
      - name: Exactly four complete native build payloads AB BA
        run: |
          $prepared = Join-Path $env:GITHUB_WORKSPACE 'prepared'
          $python = if ($env:RUNNER_OS -eq 'Windows') { Join-Path $prepared 'venv/Scripts/python.exe' } else { Join-Path $prepared 'venv/bin/python' }
          $helper = Join-Path $env:GITHUB_WORKSPACE 'tools/Generated Files/arm-build/native-link-build-screen/build_screen.py'
          & $python $helper --execute-reviewed --source (Join-Path $env:GITHUB_WORKSPACE 'package-source') --prepared $prepared --output (Join-Path $env:GITHUB_WORKSPACE 'evidence') --uv (Get-Command uv).Source --workers ${{ matrix.workers }}
          exit $LASTEXITCODE
      - name: Reviewed JSON/logs and canonical public FastAPI archives
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-link-build-${{ matrix.platform }}
          include-hidden-files: false
          if-no-files-found: warn
          retention-days: 14
          path: |
            prepared/setup-timing.json
            prepared/uv-identity.json
            prepared/wheel-provenance.json
            prepared/source-proof.json
            evidence/freeze.json
            evidence/input-plan.json
            evidence/result.json
            evidence/native-identity.json
            evidence/source-freeze.json
            evidence/payload-*/components.json
            evidence/payload-*/archive-inventory.json
            evidence/payload-*/archive-proof.json
            evidence/payload-*/build.stdout
            evidence/payload-*/build.stderr
            evidence/payload-*/artifacts/fastapi-0.119.1-py3-none-any.whl
            evidence/payload-*/artifacts/fastapi-0.119.1.tar.gz
